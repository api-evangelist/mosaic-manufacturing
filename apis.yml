aid: mosaic-manufacturing
name: Mosaic Manufacturing
description: >-
  Mosaic Manufacturing is a Toronto-based additive manufacturing company building
  automated, high-volume FFF 3D printing systems for factory-floor production of
  end-use polymer parts. Its flagship Array platform combines integrated robotics,
  intelligent scheduling software, and high-performance fused-filament-fabrication
  printers so manufacturers can cut part costs and run true production at scale.
  Mosaic also makes the Palette line of multi-material hardware and Canvas
  (canvas3d.io), a cloud/web software platform for file preparation, color/slice,
  print scheduling, and fleet management. As of this enrichment pass Mosaic
  publishes no public product API or OpenAPI-described developer surface; its
  developer-facing presence is the open-source MosaicManufacturing GitHub
  organization (3MF tooling, slicer post-processing, and firmware) plus a hosted
  support/knowledge-base portal.
